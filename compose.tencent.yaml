# Keep the existing host nginx on port 80; use TLS-ALPN-01 on port 443.
services:
  gateway:
    image: caddy:2@sha256:504a44d7d74bd2bc28a66afc4774912fc21223ca8a67734af1c54ab2f999b489
    ports:
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile.tencent:/etc/caddy/Caddyfile:ro
      - tls_data:/data
      - tls_config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
volumes:
  tls_data:
  tls_config:
